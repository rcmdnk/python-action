name: 'Python Test Action'
description: 'GitHub Action for Python (poetry/uv, pytest with coverage, linters with prek/pre-commit) '
author: 'rcmdnk'
branding:
  icon: 'check-square'
  color: 'gray-dark'

inputs:
  checkout:
    description: 'Set 1 to run checkout.'
    default: '1'
    required: true
  post-checkout-command:
    description: 'Optional shell command(s) to run right after checkout. Multiple commands can be passed as a multi-line string.'
    default: ''
    required: false
  private-repo-app-client-id:
    description: 'GitHub App Client ID for accessing private GitHub repositories. If set together with private-repo-app-private-key, private-repo-app-owner, and private-repo-app-repositories, a GitHub App token is generated and used to rewrite git URLs so that private GitHub repositories can be accessed during dependency installation.'
    default: ''
    required: false
  private-repo-app-private-key:
    description: 'Private key of the GitHub App used to access private GitHub repositories. Used together with private-repo-app-client-id.'
    default: ''
    required: false
  private-repo-app-owner:
    description: 'GitHub organization or user where the GitHub App used for private repository access is installed. Used to scope the generated GitHub App token.'
    default: ''
    required: false
  private-repo-app-repositories:
    description: 'Private GitHub repositories to scope the generated GitHub App token to. One repository name per line.'
    default: ''
    required: false
  private-repo-app-debug:
    description: 'Set 1 to print sanitized git config and run git ls-remote tests after configuring the GitHub App token for private repository access.'
    default: '0'
    required: false
  setup-python:
    description: 'Set 1 to run setup-python.'
    default: '1'
    required: true
  python-version:
    description: '`python-version` for setup-python.'
    default: '3.12'
    required: true
  setup-type: 
    description: 'Python environment setup type (poetry, uv or pip).'
    default: 'poetry'
    required: true
  setup-option: 
    description: 'Additional options for python environment setup.'
    default: ''
    required: true
  pytest:
    description: 'Set 1 to run pytest.'
    default: '1'
    required: true
  pytest-tests-path:
    description: 'Path to the directory of the test files.'
    default: 'tests/'
    required: true
  pytest-ignore:
    description: 'Comma separated test file names which are excluded from the pytest.'
    default: ''
    required: true
  pytest-separate-benchmark:
    description: 'Set 1 to run benchmark tests separately (execute only once at the main test, by --benchmark-disable) and show the benchmark results in the summary (need pytest-benchmark).'
    default: '0'
    required: true
  coverage:
    description: 'Set 1 to check coverage for pytest (pytest-cov will be installed if not installed).'
    default: '1'
    required: true
  coverage-cov-path:
    description: 'Path to check coverage.'
    default: ''
    required: true
  pytest-cov-path:
    description: 'Path to check coverage (alternative to coverage-cov-path, to keep backward compatibility).'
    default: ''
    required: true
  pytest-opt:
    description: 'Additional options for pytest.'
    default: ''
    required: true
  coverage-push:
    description: 'Set 1 to push the coverage result to coverage branch.'
    default: '0'
    required: true
  coverage-push-condition:
    description: 'Condition to push the coverage. This will be shown in the README if it is not empty.'
    default: ''
    required: true
  github_token:
    description: 'Token to push the coverage branch.'
    default: ${{ github.token }}
    required: true
  pre-commit:
    description: 'Set 1 to run pre-commit.'
    default: '0'
    required: true
  prek:
    description: 'Set 1 to run prek.'
    default: '0'
    required: true
  tmate:
    description: 'Set 1 to run tmate.'
    default: '0'
    required: true

outputs:
  pytest:
    description: "pytest status"
    value: ${{ steps.check_status.outputs.pytest }}
  pre_commit:
    description: "pre-commit status"
    value: ${{ steps.check_status.outputs.pre_commit }}
  coverage:
    description: "Coverage Percantage"
    value: ${{ steps.coverageComment.outputs.coverage }}
  color:
    description: "Coverage Color"
    value: ${{ steps.coverageComment.outputs.color }}
  warnings:
    description: "Coverage Warnings"
    value: ${{ steps.coverageComment.outputs.warnings }}
  errors:
    description: "Coverage Errors"
    value: ${{ steps.coverageComment.outputs.errors }}
  failures:
    description: "Coverage Failures"
    value: ${{ steps.coverageComment.outputs.failures }}
  skipped:
    description: "Coverage Skipped"
    value: ${{ steps.coverageComment.outputs.skipped }}
  tests:
    description: "Coverage Tests"
    value: ${{ steps.coverageComment.outputs.tests }}
  time:
    description: "Coverage Time"
    value: ${{ steps.coverageComment.outputs.time }}
  notSuccessTestInfo:
    description: "Not Success Test Info"
    value: ${{ steps.coverageComment.outputs.notSuccessTestInfo }}

runs:
  using: 'composite'
  steps:
    - uses: actions/checkout@v6
      if: ${{ inputs.checkout == '1' }}
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Run post-checkout command
      if: ${{ inputs.post-checkout-command != '' }}
      run: |
        echo "::group::post-checkout command"
        ${{ inputs.post-checkout-command }}
        echo "::endgroup::"
      shell: bash
    - name: Generate GitHub App token for private repository access
      id: private-repo-app-token
      if: ${{ inputs.private-repo-app-client-id != '' && inputs.private-repo-app-private-key != '' && inputs.private-repo-app-owner != '' && inputs.private-repo-app-repositories != '' }}
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ inputs.private-repo-app-client-id }}
        private-key: ${{ inputs.private-repo-app-private-key }}
        owner: ${{ inputs.private-repo-app-owner }}
        repositories: ${{ inputs.private-repo-app-repositories }}
        permission-contents: read
    - name: Configure Git URL rewrite for private repositories
      id: private-repo-app-config
      if: ${{ inputs.private-repo-app-client-id != '' && inputs.private-repo-app-private-key != '' && inputs.private-repo-app-owner != '' && inputs.private-repo-app-repositories != '' }}
      shell: bash
      env:
        APP_TOKEN: ${{ steps.private-repo-app-token.outputs.token }}
        APP_OWNER: ${{ inputs.private-repo-app-owner }}
        APP_REPOS: ${{ inputs.private-repo-app-repositories }}
      run: |
        set -euo pipefail

        # Use GIT_CONFIG_COUNT/GIT_CONFIG_KEY_<n>/GIT_CONFIG_VALUE_<n> to add
        # url.*.insteadOf entries on top of the runner's existing global git
        # config (~/.gitconfig or $XDG_CONFIG_HOME/git/config). This avoids
        # replacing the global config and assuming a particular path.
        # Per-repository entries keep the token attached only to the listed
        # repositories.
        count=0
        while IFS= read -r repo; do
          repo="$(echo "$repo" | xargs)"
          [ -z "$repo" ] && continue
          target="https://x-access-token:${APP_TOKEN}@github.com/${APP_OWNER}/${repo}"
          for src in \
            "ssh://git@github.com/${APP_OWNER}/${repo}" \
            "git@github.com:${APP_OWNER}/${repo}" \
            "https://github.com/${APP_OWNER}/${repo}"
          do
            key_name="GIT_CONFIG_KEY_${count}"
            val_name="GIT_CONFIG_VALUE_${count}"
            key_val="url.${target}.insteadOf"
            export "${key_name}=${key_val}"
            export "${val_name}=${src}"
            {
              echo "${key_name}=${key_val}"
              echo "${val_name}=${src}"
            } >> "$GITHUB_ENV"
            count=$((count + 1))
          done
        done <<< "$APP_REPOS"
        export GIT_CONFIG_COUNT="${count}"
        echo "GIT_CONFIG_COUNT=${count}" >> "$GITHUB_ENV"
        echo "count=${count}" >> "$GITHUB_OUTPUT"

        # Poetry uses dulwich by default, which does not honor GIT_CONFIG_*
        # env vars. Force the system git client so the rewrite applies.
        echo "POETRY_SYSTEM_GIT_CLIENT=true" >> "$GITHUB_ENV"
        echo "POETRY_EXPERIMENTAL_SYSTEM_GIT_CLIENT=true" >> "$GITHUB_ENV"

        if [ "${{ inputs.private-repo-app-debug }}" = "1" ]; then
          echo "::group::git config (effective)"
          git config --get-regexp '^url\..*\.insteadOf$' \
            | sed -E 's#x-access-token:[^@]+@#x-access-token:***@#g' || true
          echo "::endgroup::"

          echo "::group::git ls-remote tests"
          while IFS= read -r repo; do
            repo="$(echo "$repo" | xargs)"
            [ -z "$repo" ] && continue
            echo "Testing ${APP_OWNER}/${repo}"
            git ls-remote "ssh://git@github.com/${APP_OWNER}/${repo}" HEAD
          done <<< "$APP_REPOS"
          echo "::endgroup::"
        fi
    - name: Install poetry
      if: ${{ inputs.setup-type == 'poetry' }}
      run: |
        echo "::group::pipx install poetry"
        pipx install poetry
        echo "::endgroup::"
      shell: bash
    - uses: actions/setup-python@v6
      if: ${{ inputs.setup-python == '1' && inputs.setup-type != 'uv' }}
      with:
        python-version: ${{ inputs.python-version }}
        cache: ${{ inputs.setup-type }}
    - name: Install uv
      if: ${{ inputs.setup-type == 'uv' }}
      uses: astral-sh/setup-uv@v10.1.0
      with:
        enable-cache: true
        cache-dependency-glob: |
          **/pyproject.toml
          **/uv.lock
    - name: Setup python version for uv
      if: ${{ inputs.setup-type == 'uv' }}
      run: |
        echo "::group::python version for uv"
        uv python pin ${{ inputs.python-version }}
        echo "::endgroup::"
      shell: bash
    - name: Setup environment
      run: |
        echo "::group::${{ inputs.setup-type }}"
        if [ ${{ inputs.setup-type }} = 'poetry' ];then
          poetry install ${{ inputs.setup-option }}
        elif [ ${{ inputs.setup-type }} = 'uv' ];then
          uv sync ${{ inputs.setup-option }}
        else
          pip install -r requirements.txt ${{ inputs.setup-option }}
        fi
        echo "::endgroup::"
      shell: bash
    - name: Run test
      id: pytest
      if: ${{ inputs.pytest == '1' }}
      continue-on-error: true
      run: |
        if ! type pytest > /dev/null 2>&1;then
          echo "::group::install pytest"
          pip install pytest
          echo "::endgroup::"
        fi
        cmd_prefix="${{ inputs.setup-type == 'poetry' && 'poetry run ' || inputs.setup-type == 'uv' && 'uv run ' || ''}}"
        pytest_opt=("--durations=0")
        if [ "${{ inputs.coverage }}" = "1" ];then
          echo "::group::install pytest-cov"
          pip_list=$($cmd_prefix pip list 2>&1)
          if ! echo "$pip_list" | grep -q "^pytest-cov ";then
            pip install pytest-cov
          fi
          echo "::endgroup::"
          pytest_opt=("${pytest_opt[@]}" "--junitxml=pytest.xml" "--cov-report=term-missing:skip-covered")
          cov_path=src
          if [ -n "${{ inputs.coverage-cov-path }}" ];then
            cov_path="${{ inputs.coverage-cov-path }}"
          elif [ -n "${{ inputs.pytest-cov-path }}" ];then
            cov_path="${{ inputs.pytest-cov-path }}"
          fi
          pytest_opt=("${pytest_opt[@]}" "--cov=${cov_path}")
        fi
        if [ -n "${{ inputs.pytest-ignore }}" ];then
          IFS_ORIG=$IFS
          IFS=","
          read -a files <<< "${{ inputs.pytest-ignore }}"
          IFS=$IFS_ORIG
          for f in "${files[@]}";do
            pytest_opt=("${pytest_opt[@]}" "--ignore=$f")
          done
        fi
        if [ "${{ inputs.pytest-separate-benchmark }}" = "1" ];then
          pytest_opt=("${pytest_opt[@]}" "--benchmark-disable")
        fi
        echo \$ $cmd_prefix pytest "${pytest_opt[@]}" "${{ inputs.pytest-tests-path }}" ${{ inputs.pytest-opt }}
        $cmd_prefix pytest "${pytest_opt[@]}" "${{ inputs.pytest-tests-path }}" ${{ inputs.pytest-opt }}| tee pytest-coverage.txt && status=0 || status=1
        echo "status=$status" >> $GITHUB_OUTPUT
      shell: bash
    - name: Run benchmark test
      id: benchmark
      if: ${{ inputs.pytest == '1' && inputs.pytest-separate-benchmark == '1' }}
      continue-on-error: true
      run: |
        cmd_prefix="${{ inputs.setup-type == 'poetry' && 'poetry run ' || inputs.setup-type == 'uv' && 'uv run ' || ''}}"
        pytest_opt=(--benchmark-only --benchmark-enable)
        if [ -n "${{ inputs.pytest-ignore }}" ];then
          IFS_ORIG=$IFS
          IFS=","
          read -a files <<< "${{ inputs.pytest-ignore }}"
          IFS=$IFS_ORIG
          for f in "${files[@]}";do
            pytest_opt=("${pytest_opt[@]}" "--ignore=$f")
          done
        fi
        pip_list=$($cmd_prefix pip list 2>&1)
        if echo "$pip_list" | grep -q "^pytest-xdist ";then
          pytest_opt=("${pytest_opt[@]}" "-n0")
        fi
        echo \$ $cmd_prefix pytest "${pytest_opt[@]}" "${{ inputs.pytest-tests-path }}"
        $cmd_prefix pytest "${pytest_opt[@]}" "${{ inputs.pytest-tests-path }}" | tee benchmark.txt && status=0 || status=1
        echo "status=$status" >> $GITHUB_OUTPUT
      shell: bash
    - name: pre-commit
      if: ${{ inputs.pre-commit == '1' }}
      id: preCommit
      run: |
        if ! type pre-commit > /dev/null 2>&1;then
          echo "::group::install pre-commit"
          pip install pre-commit
          echo "::endgroup::"
        fi
        echo "::group::pre-commit"
        cmd_prefix="${{ inputs.setup-type == 'poetry' && 'poetry run ' || inputs.setup-type == 'uv' && 'uv run ' || ''}}"
        $cmd_prefix pre-commit run -a && status=0 || status=1
        echo "status=$status" >> $GITHUB_OUTPUT
        git checkout .
        echo "::endgroup::"
      shell: bash
    - name: prek
      if: ${{ inputs.prek == '1' }}
      id: prek
      run: |
        if ! type prek > /dev/null 2>&1;then
          echo "::group::install prek"
          pip install prek
          echo "::endgroup::"
        fi
        echo "::group::prek"
        cmd_prefix="${{ inputs.setup-type == 'poetry' && 'poetry run ' || inputs.setup-type == 'uv' && 'uv run ' || ''}}"
        $cmd_prefix prek run -a && status=0 || status=1
        echo "status=$status" >> $GITHUB_OUTPUT
        git checkout .
        echo "::endgroup::"
      shell: bash
    - name: Clear GitHub App token git environment
      # Use always() so the rewrite is dropped even when an earlier step
      # (e.g. poetry install / uv sync) fails, preventing the tokenized git
      # access from leaking into later workflow steps that use if: always().
      if: ${{ always() && inputs.private-repo-app-client-id != '' && inputs.private-repo-app-private-key != '' && inputs.private-repo-app-owner != '' && inputs.private-repo-app-repositories != '' }}
      shell: bash
      env:
        COUNT: ${{ steps.private-repo-app-config.outputs.count }}
      run: |
        set -euo pipefail
        # Disable the env-based git config layer so subsequent git operations
        # see only the runner's normal global config.
        echo "GIT_CONFIG_COUNT=0" >> "$GITHUB_ENV"
        # Scrub the token-bearing GIT_CONFIG_KEY_<n>/VALUE_<n> values so the
        # app token does not appear in `printenv` for later steps.
        if [ -n "${COUNT:-}" ] && [ "${COUNT}" -gt 0 ] 2>/dev/null; then
          i=0
          while [ "${i}" -lt "${COUNT}" ]; do
            echo "GIT_CONFIG_KEY_${i}=" >> "$GITHUB_ENV"
            echo "GIT_CONFIG_VALUE_${i}=" >> "$GITHUB_ENV"
            i=$((i + 1))
          done
        fi
        echo "POETRY_SYSTEM_GIT_CLIENT=" >> "$GITHUB_ENV"
        echo "POETRY_EXPERIMENTAL_SYSTEM_GIT_CLIENT=" >> "$GITHUB_ENV"
    - name: Pytest coverage comment
      id: coverageComment
      if: ${{ inputs.coverage == '1' }}
      uses: MishaKav/pytest-coverage-comment@main
      with:
        hide-comment: true
        pytest-coverage-path: ./pytest-coverage.txt
        junitxml-path: ./pytest.xml
    - name: Check the output coverage
      if: ${{ inputs.coverage == '1' }}
      env:
        # notSuccessTestInfo may includes brackets in skip content and it makes an error "syntax error near unexpected token `('" if it is used directly in the run
        NOT_SUCCESS_TEST_INFO: "${{ steps.coverageComment.outputs.notSuccessTestInfo }}"
      run: |
        echo "::group::coverage result"
        echo "Coverage Percantage - ${{ steps.coverageComment.outputs.coverage }}"
        echo "Coverage Color - ${{ steps.coverageComment.outputs.color }}"
        echo "Coverage Warnings - ${{ steps.coverageComment.outputs.warnings }}"
        echo "Coverage Errors - ${{ steps.coverageComment.outputs.errors }}"
        echo "Coverage Failures - ${{ steps.coverageComment.outputs.failures }}"
        echo "Coverage Skipped - ${{ steps.coverageComment.outputs.skipped }}"
        echo "Coverage Tests - ${{ steps.coverageComment.outputs.tests }}"
        echo "Coverage Time - ${{ steps.coverageComment.outputs.time }}"
        echo "Not Success Test Info - $NOT_SUCCESS_TEST_INFO"
        echo "::endgroup::"
      shell: bash
    - name: Update Readme in coverage branch with Coverage Html and commit to coverage branch
      if: ${{ inputs.coverage == '1' && inputs.coverage-push == '1'}}
      run: |
        echo "::group::coverage branch"
        coverage=$(git branch -a|grep "remotes/origin/coverage$") || :
        if [ -z "$coverage" ];then
          git checkout --orphan coverage
          git rm -rf .
        else
          git checkout coverage
        fi
        echo -n > ./README.md
        echo "commit: [$GITHUB_SHA]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/tree/$GITHUB_SHA)" >> ./README.md
        echo "" >> ./README.md
        if [ -n "${{ inputs.coverage-push-condition }}" ];then
          echo "condition: ${{ inputs.coverage-push-condition }}" >> ./README.md
          echo "" >> ./README.md
        fi
        workflow_file=$(basename $(echo $GITHUB_WORKFLOW_REF | cut -d @ -f1))
        echo "[![$GITHUB_WORKFLOW]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/workflows/$workflow_file/badge.svg)]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)" >> ./README.md
        echo -e ${{ steps.coverageComment.outputs.summaryReport }} >> ./README.md
        git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add README.md
        PRE_COMMIT_ALLOW_NO_CONFIG=1 git commit -m "Update coverage"
        echo "::endgroup::"
      shell: bash
    - name: Push
      if: ${{ inputs.coverage == '1' && inputs.coverage-push == '1' }}
      uses: ad-m/github-push-action@master
      with:
        github_token: ${{ inputs.github_token }}
        branch: coverage
    - name: Go back to the original branch
      if: ${{ inputs.coverage == '1' && inputs.coverage-push == '1'}}
      run: |
        git checkout $GITHUB_REF_NAME
      shell: bash
    - name: Check status
      id: check_status
      if: ${{ inputs.pytest == '1' || inputs.pre-commit == '1' }}
      continue-on-error: ${{ inputs.tmate == '1' }}
      run: |
        output=""
        pytest=1
        if [ "${{ inputs.pytest }}" = 1 ];then
          if [ "${{ steps.pytest.outputs.status }}" != "0" ];then
            echo "Pytest failed!"
            pytest=0
            output="${output}![pytest](https://img.shields.io/badge/pytest-failing-critical)"
          else
            output="${output}![pytest](https://img.shields.io/badge/pytest-passing-success)"
          fi
        fi
        pre_commit=1
        if [ "${{ inputs.pre-commit }}" = 1 ];then
          if [ "${{ steps.preCommit.outputs.status }}" != "0" ];then
            echo "pre-commit failed!"
            pre_commit=0
            output="${output}![pre-commit](https://img.shields.io/badge/pre_commit-failing-critical)"
          else
            output="${output}![pre-commit](https://img.shields.io/badge/pre_commit-passing-success)"
          fi
        elif [ "${{ inputs.prek }}" = 1 ];then
          if [ "${{ steps.prek.outputs.status }}" != "0" ];then
            echo "prek failed!"
            pre_commit=0
            output="${output}![pre-commit](https://img.shields.io/badge/pre_commit-failing-critical)"
          else
            output="${output}![pre-commit](https://img.shields.io/badge/pre_commit-passing-success)"
          fi
        fi
        echo -n "${output}" > $GITHUB_STEP_SUMMARY

        if [ "${{ inputs.coverage }}" = 1 ];then
          echo -e ${{ steps.coverageComment.outputs.summaryReport }} >> $GITHUB_STEP_SUMMARY
        fi
        if [ "${{ inputs.pytest-separate-benchmark }}" = 1 ];then
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Benchmark tests" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          cat benchmark.txt >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        fi
        (( pytest == 1 )) && (( pre_commit == 1 ))
      shell: bash
    - name: Setup tmate session
      if: ${{ inputs.tmate == '1' }}
      uses: mxschmitt/action-tmate@v3
